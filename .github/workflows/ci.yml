name: CI/CD

on:
  push:
    branches:
      - main
      - "feature/*"
      - master
  pull_request:
    branches:
      - main
      - master

env:
  ACR_LOGIN_SERVER: kubeliteacr1933.azurecr.io
  IMAGE_NAME: kubernetes-lite-deploy
  RESOURCE_GROUP: kube_lite_deploy
  CONTAINER_APP_NAME: kubernetes-lite-deploy

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Python
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # -----------------------------
      # Tests
      # -----------------------------
      - name: Install dependencies and run tests
        working-directory: app
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q

      # -----------------------------
      # Docker
      # -----------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------
      # Azure OIDC
      # -----------------------------
      - name: Azure login with OIDC
        if: github.event_name == 'push'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # -----------------------------
      # ACR login
      # -----------------------------
      - name: Login to Azure Container Registry
        if: github.event_name == 'push'
        run: |
          az acr login --name kubeliteacr1933

      # -----------------------------
      # Build and push SHA image
      # -----------------------------
      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # -----------------------------
      # Push latest on main
      # -----------------------------
      - name: Tag and push latest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker pull $ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA}

          docker tag \
            $ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA} \
            $ACR_LOGIN_SERVER/$IMAGE_NAME:latest

          docker push \
            $ACR_LOGIN_SERVER/$IMAGE_NAME:latest

      # -----------------------------
      # Deploy Container App
      # -----------------------------
      - name: Deploy to Azure Container Apps
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA}"

      # -----------------------------
      # Show deployment
      # -----------------------------
      - name: Show Container App status
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "{ProvisioningState:properties.provisioningState,RunningStatus:properties.runningStatus,FQDN:properties.configuration.ingress.fqdn,Revision:properties.latestRevisionName}" \
            -o table