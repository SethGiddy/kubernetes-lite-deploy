apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-lite-deploy
  labels:
    app: kubernetes-lite-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubernetes-lite-deploy
  template:
    metadata:
      labels:
        app: kubernetes-lite-deploy
    spec:
      containers:
        - name: app
          image: kubernetes-lite-deploy:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
